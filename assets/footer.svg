<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Thanks for stopping by" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="round"><rect width="1200" height="120" rx="22"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#1a0f33"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="120" fill="url(#bg)"/>

    <!-- slow wave -->
    <path fill="none" stroke="url(#shine)" stroke-width="2" stroke-opacity="0.35"
          d="M-300 88 q75 -26 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="300 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <!-- fast wave -->
    <path fill="none" stroke="url(#shine)" stroke-width="3"
          d="M-300 96 q75 -20 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0">
      <animateTransform attributeName="transform" type="translate" from="300 0" to="0 0" dur="5s" repeatCount="indefinite"/>
    </path>

    <text x="600" y="48" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="1" fill="url(#shine)">
      Thanks for stopping by &#8212; let's build something great together
      <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
